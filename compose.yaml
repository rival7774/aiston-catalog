services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-catalog}
      POSTGRES_DB: ${DB_NAME:-catalog}
      POSTGRES_HOST_AUTH_METHOD: trust
    command: ["postgres", "-c", "listen_addresses="]
    volumes:
      - data:/var/lib/postgresql/data
      - socket:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = postgres && pg_isready -h /var/run/postgresql -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 60
  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: /var/run/postgresql
      PGUSER: ${DB_USER:-catalog}
      PGDATABASE: ${DB_NAME:-catalog}
      PGSSLMODE: disable
      API_PORT: ${API_PORT:-8080}
    volumes:
      - socket:/var/run/postgresql:ro
    healthcheck:
      test: ["CMD", "/catalog", "health"]
      interval: 3s
      timeout: 3s
      retries: 60
  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_PORT: ${API_PORT:-8080}
    ports:
      - "${APP_PORT:-8080}:80"
volumes:
  data:
  socket:
